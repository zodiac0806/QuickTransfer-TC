; 鍵值必須跟程式碼裡的英文原文一字不差；找不到對應就會顯示英文。

QuickTransfer Settings==QuickTransfer 設定
(empty)==（空）
...?? total==…共 ?? 項
QuickTransfer Configuration==QuickTransfer 設定
Enabled==啟用
(Active)==（運作中）
(Disabled)==（已停用）
Debug Mode==除錯模式
(Logs to chat - for troubleshooting)==（把過程輸出到聊天視窗，排查問題用）
Enable Middle-Click Sort==啟用中鍵自動整理
Enable Company Chest (Free Company Chest)==啟用公會儲物櫃支援
(Shift/Alt: deposit/withdraw while FC chest is open)==（儲物櫃開著時，Shift／Alt 直接存入或取出）
Company Chest: Middle-Click Organize==公會儲物櫃：中鍵整理
(MMB: auto-stack + compact in FC chest)==（中鍵：自動疊堆並壓縮空格）
Auto-confirm quantity prompts (Company Chest / Split)==自動確認數量視窗（公會儲物櫃／拆分）
(Best effort; disable if it misbehaves)==（盡力而為，怪怪的就關掉）
Enable Vendor Quick Sell==啟用商店快速出售
Auto-confirm vendor sell dialogs==自動確認出售視窗
Bulk Transfer (Ctrl+Shift+RClick)==批次搬運（Ctrl＋Shift＋右鍵）
Enable Bulk Transfer==啟用批次搬運
(starts at the slot you right-click)==（以右鍵那一格為起點，往後整批搬）
Slots to move from the start point:==從起點往後搬幾格：
(0 = until the last slot)==（0 = 一路搬到最後一格）
Delay between slots (ms):==每格間隔（毫秒）：
(too low gets throttled by the server)==（調太低會被伺服器當連點擋掉）
Enable Armoury gearset cleanup (Alt+Shift+RClick)==啟用兵裝庫配裝清理（Alt＋Shift＋右鍵）
(pulls gear no gearset uses out of that compartment)==（把該部位裡沒被任何配裝用到的裝備取回背包）
Exclude list (move everything except these):==排除清單（這些不搬，其他全搬）：
Include list (move only these; overrides the exclude list):==指定清單（只搬這些；填了這裡排除清單就不生效）：
(Item IDs, separated by commas or newlines. Non-digits are ignored, so you can paste a script. HQ and NQ count as the same item.)==（填道具 ID，用逗號或換行分隔。非數字會被忽略，可以直接貼腳本內容。HQ／NQ 視為同一項。）
Transfer Cooldown (ms):==操作冷卻（毫秒）：
How to Use:==怎麼用：
Hold SHIFT and RIGHT-CLICK to use the open container's quick action==Shift＋右鍵：對目前開著的容器執行對應的搬運動作
Hold CTRL and RIGHT-CLICK to use Armoury actions when a Saddlebag, Retainer, or Company Chest is open (Inventory ↔ Armoury)==Ctrl＋右鍵：鞍囊／僱員／公會儲物櫃開著時，優先做背包 ↔ 兵裝庫
Hold ALT and RIGHT-CLICK to split a stack in half (or remove half from Company Chest)==Alt＋右鍵：把一堆道具對半拆分（在公會儲物櫃則是取出一半）
Hold CTRL+SHIFT and RIGHT-CLICK to bulk-transfer from that slot onward. Press again to abort.==Ctrl＋Shift＋右鍵：以這一格為起點整批搬。跑到一半再按一次就中止。
Bulk direction follows whatever is open: Inventory to (Retainer > Company Chest > Saddlebag > Armoury), or back to Inventory.==　批次搬運的方向看你開著什麼：背包 →（僱員＞公會儲物櫃＞陸行鳥鞍囊＞兵裝庫），反向則是搬回背包。
Depositing into the Armoury routes each piece to its own compartment; non-gear is skipped.==　存進兵裝庫時會依裝備部位自動分到對應容器；不是裝備的會跳過。
Slots skipped by the include/exclude list do not count against the slot budget.==　清單跳過的格子不算配額——配額算的是實際搬走幾格。
Hold ALT+SHIFT and RIGHT-CLICK inside an Armoury compartment to pull out every piece no gearset uses.==Alt＋Shift＋右鍵兵裝庫的某個部位：把該部位裡沒被任何配裝用到的裝備全部取回背包。
Gearset cleanup ignores the include/exclude lists, and keeps anything referenced as gear or as a glamour.==　配裝清理不吃排除／指定清單；被當成裝備或投影來源引用的都會留著。
Inventory + Saddlebags: Inventory → "Add All to Saddlebag", Saddlebags → "Remove All from Saddlebag"==背包＋陸行鳥鞍囊：背包 →「放入陸行鳥鞍囊」，鞍囊 →「從陸行鳥鞍囊中取回」
Armoury + Saddlebags: Armoury → "Add All to Saddlebag"==兵裝庫＋陸行鳥鞍囊：兵裝庫 →「放入陸行鳥鞍囊」
Inventory + Retainer: Inventory → "Entrust to Retainer", Retainer → "Retrieve from Retainer"==背包＋僱員：背包 →「交給僱員保管」，僱員 →「從僱員處取回」
Armoury + Retainer: Armoury → "Entrust to Retainer", Retainer → "Retrieve from Retainer"==兵裝庫＋僱員：兵裝庫 →「交給僱員保管」，僱員 →「從僱員處取回」
Retainer + Saddlebags: Retainer → "Add All to Saddlebag", Saddlebags → "Entrust to Retainer"==僱員＋陸行鳥鞍囊：僱員 →「放入陸行鳥鞍囊」，鞍囊 →「交給僱員保管」
Inventory + Armoury (no special container): (Gear) Inventory → "Place in Armoury Chest", Armoury → "Return to Inventory"==背包＋兵裝庫（沒開其他容器時）：裝備 →「放入兵裝庫」，兵裝庫 →「放入背包」
Company Chest (FreeCompanyChest) open: Shift+RClick Inventory/Armoury deposits, Shift+RClick Company Chest withdraws ("Remove")==公會儲物櫃開著：Shift＋右鍵背包／兵裝庫＝存入，Shift＋右鍵儲物櫃＝取出
Vendor Shop open: Shift+RClick to auto-select "Sell"; enable "Auto-confirm vendor sell" to auto-fill quantity and confirm.==商店開著：Shift＋右鍵自動選「出售」，開啟自動確認就會連數量與確認視窗一起處理
Middle-Click: Sort the clicked container when a "Sort" menu entry exists. In Company Chest, MMB runs an organize pass (stack + compact).==中鍵：該容器有「自動整理」就直接整理；在公會儲物櫃則是執行疊堆＋壓縮
Use /qt or click 'Open Config' in plugin list to reopen this window==用 /qt 或插件清單的「開啟設定」可以叫回這個視窗
Notes:==注意事項：
This uses the game's existing context menu options (no manual slot moving).==這個插件只是幫你點遊戲本來就有的右鍵選單，不會自己搬格子。
If an option isn't available for the clicked item, nothing happens.==如果該道具沒有對應的選單項目，按了就是沒反應，這是正常的。
If you tap Shift briefly, the action still triggers (it is captured when the menu opens).==Shift 只按一下就放開也沒關係，按鍵狀態是在選單開啟的瞬間就記下來的。
For Company Chest deposits, this uses the same UI move function as drag+drop would.==公會儲物櫃的存入走的是跟拖放同一個遊戲內部函式。
Menu entries are matched against the game's own data sheets, so switching client language keeps working.==選單項目是用遊戲資料表比對的，切換客戶端語言一樣能用。
Bulk transfer stops and names the item when something cannot be moved.==批次搬運遇到搬不動的道具會直接中止，並告訴你是哪一個。
Save & Close==儲存並關閉
