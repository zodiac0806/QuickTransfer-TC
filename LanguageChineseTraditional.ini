'??' would not move after ?? attempts; aborting.==「??」試了 ?? 次都搬不動，中止。
[QuickTransfer] Company Chest is responding slowly (server throttling); slowing down.==[QuickTransfer] 儲物櫃回應慢（伺服器節流），放慢重試中……
Done.==完成。
Reached the last slot.==已掃到最後一格。
Destination is full (?? has no free slot).==目標已滿（?? 沒有空位）。
Failed to submit the move for '??'; aborting.==送出搬運失敗（「??」），中止。
?? kept (used by a gearset).==?? 件因為在配裝裡而保留。
?? slots skipped by the list.==依清單跳過 ?? 格。
[QuickTransfer] Bulk transfer finished: ?? Moved ?? slots.??==[QuickTransfer] 批次搬運結束：?? 共搬了 ?? 格。??
unknown item==未知道具
item #??==道具#??
